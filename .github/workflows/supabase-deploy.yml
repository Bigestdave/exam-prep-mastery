name: Supabase deploy (migrations & functions)

on:
  push:
    branches: [ main ]

jobs:
  supabase-deploy:
    name: Deploy Supabase (migrations + functions)
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node/NPM
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install supabase CLI
        run: npm install -g supabase

      - name: Link project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase link --project-ref ykkspgvhveaeeaisprqz

      - name: Push DB migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase db push --linked

      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -d supabase/functions ]; then
            for fn in supabase/functions/*; do
              if [ -d "$fn" ]; then
                name=$(basename "$fn")
                echo "Deploying function: $name"
                supabase functions deploy "$name" --linked
              fi
            done
          else
            echo "No supabase/functions directory found. Skipping."
          fi
